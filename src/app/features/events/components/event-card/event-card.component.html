<div class="bg-white rounded-2xl border border-[#c5c6d3] overflow-hidden hover:shadow-xl transition-all duration-300 flex flex-col justify-between group h-full">
      
      <div>
        <!-- Image & Badge -->
        <div class="relative h-48 overflow-hidden bg-gray-100">
          <img
            [src]="eventItem().thumbnailUrl"
            [alt]="eventItem().title"
            class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500"
          />
          <div class="absolute top-3 left-3 bg-[#2F4997] text-white text-[11px] font-bold px-3 py-1 rounded-md shadow-sm">
            {{ eventItem().badge }}
          </div>
        </div>

        <!-- Details -->
        <div class="p-6">
          <div class="flex items-center gap-2 text-xs font-semibold text-[#D4AF37] mb-2">
            <span class="material-symbols-outlined text-base">calendar_today</span>
            <span>{{ eventItem().date }}</span>
          </div>

          <h3 class="text-lg font-bold text-[#2F4997] mb-3 leading-snug group-hover:text-[#12317f] transition-colors">
            {{ eventItem().title }}
          </h3>

          <div class="flex items-center gap-1.5 text-xs text-[#4A5568] mb-4">
            <span class="material-symbols-outlined text-base text-[#2F4997]">location_on</span>
            <span>{{ eventItem().location }}</span>
          </div>
        </div>
      </div>

      <!-- Action Footer -->
      <div class="px-6 pb-6 pt-2 border-t border-gray-100">
        <a
          [routerLink]="['/eventos', eventItem().slug]"
          class="w-full py-2.5 bg-[#2F4997] hover:bg-[#12317f] text-white font-bold text-xs rounded-xl flex items-center justify-center gap-2 transition-all cursor-pointer shadow-xs"
        >
          <span>Ver Detalle del Evento</span>
          <span class="material-symbols-outlined text-sm">arrow_forward</span>
        </a>
      </div>

    </div>
