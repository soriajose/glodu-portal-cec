<section class="py-12 bg-[#f3f3f3] my-8 rounded-3xl mx-4 md:mx-10 border border-[#c5c6d3]/60 shadow-sm">
      <div class="max-w-[1200px] mx-auto px-6 md:px-12">
        <div class="flex flex-col md:flex-row items-center gap-10 md:gap-14">
          <!-- Video Thumbnail Container -->
          <button
            type="button"
            (click)="openPreviewModal.set(true)"
            class="w-full md:w-3/5 group cursor-pointer relative overflow-hidden rounded-2xl shadow-xl border border-white/40 text-left p-0 border-0"
          >
            <img
              [src]="videoData().imageUrl"
              [alt]="videoData().title"
              class="w-full aspect-[1.81] object-cover group-hover:scale-105 transition-transform duration-700"
            />
            
            <!-- Play Overlay -->
            <div class="absolute inset-0 bg-black/40 flex items-center justify-center opacity-90 group-hover:opacity-100 transition-opacity">
              <div class="w-20 h-20 bg-[#2F4997]/90 text-white rounded-full flex items-center justify-center shadow-2xl group-hover:scale-110 transition-transform">
                <span class="material-symbols-outlined text-5xl filled">play_arrow</span>
              </div>
            </div>

            <!-- Badge -->
            <div class="absolute top-4 left-4 bg-[#ba1a1a] text-white px-3 py-1 rounded-md text-xs font-bold uppercase flex items-center gap-1.5 shadow-md">
              <span class="w-2 h-2 rounded-full bg-white animate-pulse"></span>
              {{ videoData().badge }}
            </div>
          </button>

          <!-- Video Text & CTA -->
          <div class="w-full md:w-2/5 flex flex-col justify-center">
            <span class="text-[#D4AF37] text-xs font-bold uppercase tracking-widest mb-2">
              Evento Magistral
            </span>
            <h2 class="text-2xl md:text-3xl font-bold text-[#2F4997] mb-4 leading-tight">
              {{ videoData().title }}
            </h2>
            <p class="text-sm md:text-base text-[#444651] mb-8 leading-relaxed">
              {{ videoData().description }}
            </p>
            <a
              routerLink="/eventos/22-jornada-notarial-cordobesa"
              class="inline-flex items-center gap-2 text-[#12317f] font-bold text-sm md:text-base border-b-2 border-[#12317f] pb-1 hover:text-[#D4AF37] hover:border-[#D4AF37] transition-all group w-fit"
            >
              Ver video completo
              <span class="material-symbols-outlined text-xl group-hover:translate-x-1 transition-transform">arrow_forward</span>
            </a>
          </div>
        </div>
      </div>

      <!-- Quick Video Modal Preview -->
      @if (openPreviewModal()) {
        <div
          role="dialog"
          aria-modal="true"
          tabindex="0"
          (keyup.escape)="openPreviewModal.set(false)"
          class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 text-white"
        >
          <button
            type="button"
            class="fixed inset-0 w-full h-full bg-transparent border-0 p-0 cursor-default"
            (click)="openPreviewModal.set(false)"
            aria-label="Cerrar modal"
          ></button>
          <div class="relative z-10 bg-black rounded-2xl shadow-2xl max-w-4xl w-full overflow-hidden border border-white/20">
            <div class="p-4 bg-[#2F4997] text-white flex justify-between items-center">
              <h3 class="font-bold text-base truncate">{{ videoData().title }} - Video Magistral</h3>
              <button type="button" (click)="openPreviewModal.set(false)" class="p-1 rounded-lg hover:bg-white/20">
                <span class="material-symbols-outlined">close</span>
              </button>
            </div>
            <div class="aspect-video w-full bg-black relative flex items-center justify-center">
              <iframe
                class="w-full h-full"
                src="https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1"
                title="Video de la Jornada Notarial"
                frameborder="0"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                allowfullscreen
              ></iframe>
            </div>
          </div>
        </div>
      }
    </section>
